<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvestConnect — Настройки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-body">
  <div class="dashboard-layout">
    <aside class="sidebar card">
      <a class="brand" href="index.html">InvestConnect</a>
      <nav>
        <a class="nav-glow" href="dashboard.html">Панель мониторинга</a>
        <a class="nav-glow" href="marketplace.html">Стартапы</a>
        <a class="nav-glow" href="portfolio.html">Портфолио</a>
        <a class="nav-glow" href="analytics.html">Аналитика</a>
        <a class="nav-glow" href="messages.html">Сообщения</a>
        <a class="active nav-glow" href="settings.html">Настройки</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-top card page-header-row">
        <div>
          <h2>Настройки</h2>
          <p class="lead">Персонализация уведомлений и профиля инвестора.</p>
        </div>
        <button class="btn btn-primary glow-btn" type="button">Сохранить</button>
      </header>
      <section class="filters panel card">
        <div>
          <label>Частота email-уведомлений</label>
          <select>
            <option>Ежедневно</option>
            <option>Еженедельно</option>
            <option>Только важные</option>
          </select>
        </div>
        <div>
          <label>Риск-профиль</label>
          <select>
            <option>Сбалансированный</option>
            <option>Консервативный</option>
            <option>Агрессивный</option>
          </select>
        </div>
      </section>
    </main>
