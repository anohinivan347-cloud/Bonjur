<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-staff HR Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-soft: #11131c;
      --panel: rgba(255,255,255,.04);
      --panel-2: rgba(255,255,255,.06);
      --text: #e0e6f2;
      --muted: #8fa2c4;
      --line: rgba(0,163,255,.35);
      --accent: #00a3ff;
      --accent-2: #0a66c2;
      --success: #1fc77b;
      --warn: #ffc247;
      --neutral: #94a3b8;
      --danger: #ff5b7a;
      --radius: 14px;
      --glow: 0 0 0.4rem rgba(0,163,255,.5), 0 0 1rem rgba(0,163,255,.3);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(0,163,255,.16), transparent 26%),
        radial-gradient(circle at 88% 90%, rgba(10,102,194,.15), transparent 30%),
        var(--bg);
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #090c14; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(var(--accent), #0877d4); border-radius: 999px; }

    .app {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 360px;
      gap: 14px;
      height: 100vh;
      padding: 14px;
    }

    .sidebar, .main, .details {
      border: 1px solid rgba(0,163,255,.25);
      border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(17,19,28,.94), rgba(11,13,20,.94));
      box-shadow: var(--glow);
      min-height: 0;
    }

    .sidebar { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .8px;
      color: #fff;
      text-shadow: var(--glow);
    }
    .logo span { color: var(--accent); }

    .menu { display: grid; gap: 8px; }
    .menu-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
      border-left: 3px solid transparent;
      border-radius: 10px;
      text-align: left;
      padding: 10px 10px;
      cursor: pointer;
      transition: .22s ease;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .menu-btn:hover, .menu-btn.active {
      border-color: rgba(0,163,255,.4);
      border-left-color: var(--accent);
      color: #d8f1ff;
      background: rgba(0,163,255,.11);
      box-shadow: var(--glow);
    }

    .main { padding: 14px; overflow: auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(0,163,255,.3);
      border-radius: 12px;
      background: var(--panel);
      padding: 12px;
      margin-bottom: 14px;
    }

    .user { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(145deg, #0084cc, #0a66c2);
      display: grid; place-items: center; font-weight: 700;
      box-shadow: var(--glow);
    }

    .btn, select, input {
      border-radius: 10px;
      border: 1px solid rgba(0,163,255,.4);
      background: rgba(5,10,20,.8);
      color: var(--text);
      padding: 9px 10px;
    }
    .btn { cursor: pointer; font-weight: 600; transition: .2s; }
    .btn:hover { background: var(--accent); color: #fff; box-shadow: var(--glow); }
    .btn-danger { border-color: rgba(255,91,122,.45); }
    .btn-danger:hover { background: var(--danger); }

    .content-grid { display: grid; grid-template-columns: 1.55fr .9fr; gap: 12px; }
    .card {
      border: 1px solid rgba(0,163,255,.3);
      border-radius: 12px;
      background: var(--panel);
      padding: 12px;
      animation: fade .24s ease;
    }

    @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

    .title-row { display:flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .title-row h3 { margin: 0; font-size: 16px; }

    .filters { display: grid; grid-template-columns: 1fr 165px 165px; gap: 8px; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid rgba(143,162,196,.22); padding: 9px 6px; text-align: left; font-size: 13px; }
    th { color: #9cccf0; font-weight: 600; }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid;
      white-space: nowrap;
    }
    .s-review { color: #73c7ff; border-color: #4ea7de; background: rgba(78,167,222,.17); }
    .s-interview { color: #ffd778; border-color: #d4a844; background: rgba(212,168,68,.17); }
    .s-hired { color: #6dffb7; border-color: #3fc68e; background: rgba(63,198,142,.17); }
    .s-reject { color: #b5c4db; border-color: #8da0bd; background: rgba(141,160,189,.12); }
    .s-train { color: #78e4ff; border-color: #32b6d7; background: rgba(50,182,215,.16); }

    .stats-list, .responses { display: grid; gap: 8px; }
    .chip {
      cursor: pointer;
      border: 1px solid rgba(0,163,255,.3);
      border-radius: 10px;
      padding: 9px;
      background: var(--panel-2);
      display: flex;
      justify-content: space-between;
      transition: .2s;
    }
    .chip:hover { transform: translateY(-1px); box-shadow: var(--glow); }

    .metric {
      border: 1px solid rgba(0,163,255,.35);
      border-radius: 12px;
      background: rgba(0,163,255,.08);
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .metric .big { font-size: 28px; color: #b9e9ff; text-shadow: var(--glow); font-weight: 800; }
    .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mini > div { background: rgba(255,255,255,.04); border-radius: 10px; padding: 8px; font-size: 12px; }

    .details { padding: 14px; overflow: auto; }
    .section { margin-bottom: 12px; }
    .section h4 { margin: 0 0 8px; color: #9acff6; }
    .tag { display: inline-block; margin: 0 6px 6px 0; padding: 5px 8px; border-radius: 999px; background: rgba(0,163,255,.14); border: 1px solid rgba(0,163,255,.4); font-size: 12px; }

    .tabs-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tabs-links button { font-size: 12px; }

    .modal {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(2,6,12,.75); z-index: 20;
    }
    .modal.open { display: flex; }
    .modal-box {
      width: min(520px, 95vw);
      border: 1px solid rgba(0,163,255,.5);
      border-radius: 12px;
      background: #0d1220;
      padding: 14px;
      box-shadow: var(--glow);
    }

    .muted { color: var(--muted); font-size: 12px; }
    .line { border-top: 1px solid rgba(143,162,196,.24); margin: 10px 0; }

    @media (max-width: 1200px) {
      .app { grid-template-columns: 240px 1fr; }
      .details { display: none; }
    }
    @media (max-width: 880px) {
      body { overflow: auto; }
      .app { height: auto; grid-template-columns: 1fr; }
      .sidebar, .main { min-height: auto; }
      .filters, .content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><span>e-</span>staff</div>
      <nav class="menu" id="menu"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div id="greet" style="font-weight:700;">Добрый день, Елена</div>
          <div class="muted">HR-департамент • кадровый портал</div>
        </div>
        <div class="user">
          <div class="avatar">HR</div>
          <button class="btn btn-danger" id="logout">Выход</button>
        </div>
      </header>
      <section id="content"></section>
    </main>

    <aside class="details" id="details"></aside>
  </div>

  <div class="modal" id="testModal">
    <div class="modal-box">
      <div class="title-row"><h3>Назначить тестирование</h3><button class="btn" onclick="closeModal()">Закрыть</button></div>
      <form id="testForm"></form>
    </div>
  </div>

<script>
const LS = { candidates:'hr_candidates_v2', vacancies:'hr_vacancies_v2', tests:'hr_tests_v2', responses:'hr_responses_v2', employees:'hr_employees_v2', ui:'hr_ui_v2' };
const MENUS = [
  {id:'vacancies', icon:'fa-briefcase', label:'Вакансии'},
  {id:'candidates', icon:'fa-user-group', label:'Кандидаты'},
  {id:'employees', icon:'fa-id-card', label:'Сотрудники'},
  {id:'tests', icon:'fa-vial-circle-check', label:'Тесты'},
  {id:'stats', icon:'fa-chart-line', label:'Статистика'},
  {id:'calendar', icon:'fa-calendar-days', label:'Календарь'},
  {id:'events', icon:'fa-bolt', label:'События'},
  {id:'tasks', icon:'fa-list-check', label:'Задачи'},
  {id:'org', icon:'fa-sitemap', label:'Орг. структура'},
  {id:'partners', icon:'fa-building', label:'Контрагенты'},
  {id:'call', icon:'fa-headset', label:'Колл-центр'},
  {id:'analytics', icon:'fa-chart-pie', label:'Аналитика'},
  {id:'settings', icon:'fa-gear', label:'Настройки'}
];
const STATUS = {
  'В рассмотрении': 's-review', 'Интервью': 's-interview', 'Принят': 's-hired', 'Не принят': 's-reject', 'Проходит обучение': 's-train'
};

const state = { tab:'candidates', selectedId:null, filterStatus:'all', filterVacancy:'all', query:'' };
const el = (id) => document.getElementById(id);
const uid = () => Date.now() + Math.floor(Math.random()*10000);
const get = (k, fallback=[]) => JSON.parse(localStorage.getItem(k) || JSON.stringify(fallback));
const set = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const fmt = (d) => new Date(d).toLocaleDateString('ru-RU');
const esc = (s='') => String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function seed() {
  if (localStorage.getItem(LS.candidates)) return;
  const vacancies = ['Инженер','CAD-инженер','Ведущий инженер-конструктор','HR-менеджер','Технический писатель','QA инженер','Data Analyst'];
  set(LS.vacancies, vacancies.map((v,i)=>({id:uid()+i,title:v,opened:3+i}))); 
  set(LS.tests, [
    {id:uid(), title:'Логика и аналитика'},
    {id:uid(), title:'Коммуникации в команде'},
    {id:uid(), title:'Инженерный минимум (CAD)'},
    {id:uid(), title:'Корпоративная безопасность'}
  ]);
  set(LS.candidates, [
    person('Яна Волобуева','CAD-инженер','В рассмотрении'),
    person('Жубар Петр','Инженер','Интервью'),
    person('Марина Коваль','Ведущий инженер-конструктор','Проходит обучение'),
    person('Игорь Рязанов','QA инженер','Не принят'),
    person('Диана Нечаева','Data Analyst','В рассмотрении'),
    person('Александр Белов','Технический писатель','Принят'),
    person('Тимур Кадыров','Инженер','Интервью'),
    person('Елена Степаненко','HR-менеджер','В рассмотрении')
  ]);
  set(LS.responses, [
    {id:uid(), fullName:'Карина Савельева', snippet:'7 лет в промышленном дизайне', date:'2026-03-27', source:'hh.ru'},
    {id:uid(), fullName:'Сергей Муромцев', snippet:'Опыт в CAD/CAM и SolidWorks', date:'2026-03-28', source:'Habr Career'},
    {id:uid(), fullName:'Анна Мешкова', snippet:'HRBP, опыт в IT и аутсорсе', date:'2026-03-26', source:'LinkedIn'}
  ]);
  set(LS.employees, [{id:uid(), fullName:'Александр Белов', position:'Технический писатель', hireDate:'2026-02-20'}]);
  set(LS.ui, {selected:null});
}

function person(fullName, vacancy, status) {
  return {
    id: uid(), fullName, vacancy, status,
    createdAt: new Date(Date.now()-86400000*8).toISOString(), updatedAt: new Date().toISOString(),
    exp: '3+ года', education: 'МГТУ им. Баумана, 2021', specialty: 'Машиностроение', direction: 'Инженерный подбор',
    skills: ['AutoCAD', 'SolidWorks', 'MS Office', 'Коммуникации'],
    jobs:[{name:'ООО Техпром', period:'2022-2025'}, {name:'НИИ Проект', period:'2021-2022'}],
    emailThread: 'Обсуждение условий оффера и даты интервью.', msgThread:'Переписка в Telegram/корп. мессенджере.', attachments:['resume.pdf','portfolio.zip'], tests:[]
  }
}

function menuRender() {
  el('menu').innerHTML = MENUS.map(m => `
    <button class="menu-btn ${state.tab===m.id?'active':''}" onclick="switchTab('${m.id}')"><i class="fa-solid ${m.icon}"></i>${m.label}</button>
  `).join('');
}

function switchTab(tab){ state.tab = tab; render(); }
window.switchTab = switchTab;

function render() { menuRender(); renderContent(); renderDetails(); }

function renderContent() {
  const c = el('content');
  if (state.tab === 'candidates') return c.innerHTML = candidatesView();
  if (state.tab === 'vacancies') return c.innerHTML = vacanciesView();
  if (state.tab === 'employees') return c.innerHTML = employeesView();
  if (state.tab === 'tests') return c.innerHTML = testsView();
  if (state.tab === 'stats' || state.tab === 'analytics') return c.innerHTML = statsView();
  if (state.tab === 'settings') return c.innerHTML = settingsView();
  c.innerHTML = genericView();
}

function candidatesView() {
  const list = get(LS.candidates);
  const vacancies = get(LS.vacancies);
  const filtered = list.filter(x => (state.filterStatus==='all'||x.status===state.filterStatus) && (state.filterVacancy==='all'||x.vacancy===state.filterVacancy) && x.fullName.toLowerCase().includes(state.query.toLowerCase()));
  const statusCounts = Object.keys(STATUS).map(k => ({name:k, count:list.filter(c=>c.status===k).length}));

  return `<div class="content-grid">
    <div class="card">
      <div class="title-row"><h3>По вакансиям — кандидаты / резюме</h3><span class="muted">${filtered.length} записей</span></div>
      <div class="filters">
        <input placeholder="Поиск по ФИО" value="${esc(state.query)}" oninput="state.query=this.value;render()" />
        <select onchange="state.filterStatus=this.value;render()"><option value="all">Все статусы</option>${Object.keys(STATUS).map(s=>`<option ${state.filterStatus===s?'selected':''}>${s}</option>`).join('')}</select>
        <select onchange="state.filterVacancy=this.value;render()"><option value="all">Все вакансии</option>${vacancies.map(v=>`<option ${state.filterVacancy===v.title?'selected':''}>${esc(v.title)}</option>`).join('')}</select>
      </div>
      <table><thead><tr><th>ФИО</th><th>Вакансия</th><th>Статус</th><th></th></tr></thead><tbody>
      ${filtered.map(x=>`<tr>
        <td>${esc(x.fullName)}</td><td>${esc(x.vacancy)}</td>
        <td><span class="status ${STATUS[x.status]||'s-review'}">${x.status}</span></td>
        <td><button class="btn" onclick="selectCandidate(${x.id})"><i class="fa-regular fa-eye"></i></button></td>
      </tr>`).join('') || '<tr><td colspan="4">Нет данных</td></tr>'}
      </tbody></table>
    </div>

    <div style="display:grid;gap:12px;">
      <div class="card"><div class="title-row"><h3>Статусы</h3><span class="muted">кликабельно</span></div>
      <div class="stats-list">${statusCounts.map(s=>`<div class="chip" onclick="state.filterStatus='${s.name}';state.tab='candidates';render()"><span>${s.name}</span><strong>${s.count}</strong></div>`).join('')}</div></div>

      <div class="card"><div class="title-row"><h3>Отклики с сайтов</h3></div>
      <div class="responses">${get(LS.responses).map(r=>`<div class="chip"><span><strong>${esc(r.fullName)}</strong><br><small>${esc(r.snippet)}</small><br><span class="muted">${fmt(r.date)} • ${r.source}</span></span><button class="btn" title="Просмотр"><i class="fa-regular fa-eye"></i></button></div>`).join('')}</div></div>

      <div class="metric">
        <div class="muted">До <strong>60% быстрее</strong> закрытие вакансий</div>
        <div class="big">7</div>
        <div class="mini"><div><strong>+4</strong><br>неактивных</div><div><strong>3 дня</strong><br>было</div><div><strong>1 день</strong><br>стало</div></div>
      </div>
    </div>
  </div>`;
}

function vacanciesView() {
  const vacancies = get(LS.vacancies); const cands = get(LS.candidates);
  return `<div class="card"><div class="title-row"><h3>Вакансии</h3><button class="btn" onclick="createVacancy()">+ Новая</button></div>
  <table><thead><tr><th>Вакансия</th><th>Открыто позиций</th><th>Кандидатов</th><th></th></tr></thead><tbody>
  ${vacancies.map(v=>`<tr><td>${esc(v.title)}</td><td>${v.opened}</td><td>${cands.filter(c=>c.vacancy===v.title).length}</td><td><button class="btn" onclick="removeVacancy(${v.id})">Удалить</button></td></tr>`).join('')}
  </tbody></table></div>`;
}

function employeesView() {
  const emps = get(LS.employees);
  return `<div class="card"><h3>Сотрудники</h3><table><thead><tr><th>ФИО</th><th>Должность</th><th>Дата найма</th></tr></thead><tbody>
  ${emps.map(e=>`<tr><td>${esc(e.fullName)}</td><td>${esc(e.position)}</td><td>${fmt(e.hireDate)}</td></tr>`).join('') || '<tr><td colspan="3">Пока нет</td></tr>'}
  </tbody></table></div>`;
}

function testsView() {
  const tests = get(LS.tests);
  return `<div class="card"><h3>Тесты</h3><div class="stats-list">${tests.map(t=>`<div class="chip"><span>${esc(t.title)}</span><span class="muted">доступен</span></div>`).join('')}</div></div>`;
}

function statsView() {
  const c = get(LS.candidates); const e = get(LS.employees);
  return `<div class="content-grid"><div class="card"><h3>Статистика</h3><div class="mini"><div><strong>${c.length}</strong><br>кандидатов</div><div><strong>${e.length}</strong><br>сотрудников</div><div><strong>${c.filter(x=>x.status==='Интервью').length}</strong><br>интервью</div></div></div>
  <div class="card"><h3>Конверсия</h3><p class="muted">Принято: ${c.filter(x=>x.status==='Принят').length} • Отказ: ${c.filter(x=>x.status==='Не принят').length}</p></div></div>`;
}

function genericView() {
  const names = {calendar:'Календарь',events:'События',tasks:'Задачи',org:'Орг. структура',partners:'Контрагенты',call:'Колл-центр'};
  return `<div class="card"><h3>${names[state.tab] || 'Раздел'}</h3><p class="muted">Демо-раздел в стиле HR-панели с неоновыми акцентами. Можно расширить бизнес-логикой.</p></div>`;
}

function settingsView() {
  return `<div class="card"><h3>Настройки</h3><p class="muted">Сбросить демо-данные localStorage.</p><button class="btn btn-danger" onclick="resetData()">Сброс</button></div>`;
}

function renderDetails() {
  if (window.innerWidth <= 1200) return;
  const panel = el('details');
  if (state.tab !== 'candidates') {
    panel.innerHTML = `<div class="card"><h3>Информация</h3><p class="muted">Откройте вкладку «Кандидаты», чтобы увидеть детальную карточку кандидата.</p></div>`;
    return;
  }
  const list = get(LS.candidates);
  const sel = list.find(x => x.id === state.selectedId) || list[0];
  if (!sel) return panel.innerHTML = '<div class="card">Нет кандидатов</div>';
  state.selectedId = sel.id;

  panel.innerHTML = `<div class="card section"><h3>${esc(sel.fullName)}</h3>
    <div><span class="status ${STATUS[sel.status]||'s-review'}">${sel.status}</span></div>
    <div class="muted">Создано: ${fmt(sel.createdAt)} • Обновлено: ${fmt(sel.updatedAt)}</div>
  </div>

  <div class="card section">
    <h4>Общие сведения</h4>
    <div class="muted">Стаж: ${esc(sel.exp)} • Образование: ${esc(sel.education)}</div>
    <div class="muted">Направление: ${esc(sel.direction)} • Специальность: ${esc(sel.specialty)}</div>
    <div class="line"></div>
    <h4>Навыки</h4>
    ${sel.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}
    <h4>Места работы</h4>
    ${sel.jobs.map(j=>`<div class="muted">• ${esc(j.name)} (${esc(j.period)})</div>`).join('')}
    <h4>Вакансия</h4>
    <div>${esc(sel.vacancy)}</div>
    <h4>Личное дело</h4>
    ${sel.attachments.map(f=>`<span class="tag"><i class="fa-regular fa-file"></i> ${esc(f)}</span>`).join('')}

    <div class="tabs-links">
      <button class="btn" onclick="alert('E-mail: ${esc(sel.emailThread)}')">Переписка по E-mail</button>
      <button class="btn" onclick="alert('Мессенджеры: ${esc(sel.msgThread)}')">Переписка в мессенджерах</button>
      <button class="btn" onclick="alert('Приложения: ${sel.attachments.join(', ')}')">Приложения</button>
    </div>

    <div class="line"></div>
    <label class="muted">Изменить статус</label>
    <select onchange="changeStatus(${sel.id}, this.value)">${Object.keys(STATUS).map(s=>`<option ${s===sel.status?'selected':''}>${s}</option>`).join('')}</select>
    <div class="tabs-links" style="margin-top:8px;">
      <button class="btn" onclick="changeStatus(${sel.id},'Интервью')">Пригласить на собеседование</button>
      <button class="btn" onclick="changeStatus(${sel.id},'Проходит обучение')">Отправить на обучение</button>
      <button class="btn" onclick="changeStatus(${sel.id},'Принят')">Принять на работу</button>
    </div>
  </div>`;
}

function selectCandidate(id){ state.selectedId = id; renderDetails(); }
window.selectCandidate = selectCandidate;

function changeStatus(id, value) {
  const data = get(LS.candidates);
  const i = data.findIndex(c => c.id===id);
  if (i < 0) return;
  data[i].status = value;
  data[i].updatedAt = new Date().toISOString();
  set(LS.candidates, data);

  if (value === 'Проходит обучение') openTestModal(id);
  if (value === 'Принят') {
    const emps = get(LS.employees);
    if (!emps.some(e => e.fullName === data[i].fullName)) {
      emps.push({id:uid(), fullName:data[i].fullName, position:data[i].vacancy, hireDate:new Date().toISOString()});
      set(LS.employees, emps);
    }
    alert(`Сотрудник ${data[i].fullName} добавлен в штат (демо).`);
    console.log('Employee created:', data[i].fullName);
  }
  render();
}
window.changeStatus = changeStatus;

function openTestModal(id) {
  const tests = get(LS.tests);
  el('testForm').innerHTML = `${tests.map(t=>`<label style="display:block;margin-bottom:7px;"><input type="checkbox" name="test" value="${t.id}" /> ${esc(t.title)}</label>`).join('')}
  <button class="btn" type="submit">Сохранить</button>`;
  el('testForm').onsubmit = (e) => {
    e.preventDefault();
    const chosen = Array.from(e.target.querySelectorAll('input[name="test"]:checked')).map(x => Number(x.value));
    const data = get(LS.candidates); const i = data.findIndex(c=>c.id===id);
    data[i].tests = chosen; set(LS.candidates, data);
    closeModal(); render();
  };
  el('testModal').classList.add('open');
}
function closeModal(){ el('testModal').classList.remove('open'); }
window.closeModal = closeModal;

function createVacancy() {
  const t = prompt('Название вакансии');
  if (!t) return;
  const list = get(LS.vacancies); list.push({id:uid(), title:t.trim(), opened:1}); set(LS.vacancies, list); render();
}
window.createVacancy = createVacancy;

function removeVacancy(id){ if(confirm('Удалить вакансию?')){ set(LS.vacancies, get(LS.vacancies).filter(v=>v.id!==id)); render(); } }
window.removeVacancy = removeVacancy;

function resetData(){ if(confirm('Очистить все демо-данные?')){ Object.values(LS).forEach(k=>localStorage.removeItem(k)); seed(); render(); } }
window.resetData = resetData;

el('logout').addEventListener('click', ()=>alert('Демо: выход из системы'));
seed();
state.selectedId = get(LS.ui, {selected:null}).selected || get(LS.candidates)[0]?.id;
render();
</script>
</body>
</html>
