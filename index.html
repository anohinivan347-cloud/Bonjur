<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Простые задачи</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, sans-serif;
      }
      body {
        margin: 0;
        background: #f5f5f5;
        color: #1f2937;
      }
      .app {
        max-width: 560px;
        margin: 40px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        padding: 20px;
      }
      h1 {
        margin-top: 0;
        font-size: 22px;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      .add {
        background: #2563eb;
        color: #fff;
      }
      ul {
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      .task {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .done {
        text-decoration: line-through;
        color: #6b7280;
      }
      .delete {
        background: #ef4444;
        color: white;
      }
      .hint {
        font-size: 14px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Список задач</h1>
      <p class="hint">Простой интерфейс: добавить, отметить выполненной и удалить задачу.</p>
      <div class="controls">
        <input id="taskInput" type="text" placeholder="Введите задачу" />
        <button id="addBtn" class="add">Добавить</button>
      </div>
      <ul id="taskList"></ul>
    </main>

    <script>
      const input = document.getElementById('taskInput');
      const addBtn = document.getElementById('addBtn');
      const list = document.getElementById('taskList');

      function getTasks() {
        return JSON.parse(localStorage.getItem('tasks') || '[]');
      }

      function saveTasks(tasks) {
        localStorage.setItem('tasks', JSON.stringify(tasks));
      }

      function render() {
        const tasks = getTasks();
        list.innerHTML = '';

        tasks.forEach((task, index) => {
          const li = document.createElement('li');

          const taskWrap = document.createElement('div');
          taskWrap.className = 'task';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.done;
          checkbox.addEventListener('change', () => {
            tasks[index].done = checkbox.checked;
            saveTasks(tasks);
            render();
          });

          const text = document.createElement('span');
          text.textContent = task.text;
          if (task.done) text.classList.add('done');

          taskWrap.append(checkbox, text);

          const del = document.createElement('button');
          del.textContent = 'Удалить';
          del.className = 'delete';
          del.addEventListener('click', () => {
            tasks.splice(index, 1);
            saveTasks(tasks);
            render();
          });

          li.append(taskWrap, del);
          list.append(li);
        });
      }

      function addTask() {
        const value = input.value.trim();
        if (!value) return;
        const tasks = getTasks();
        tasks.push({ text: value, done: false });
        saveTasks(tasks);
        input.value = '';
        render();
      }

      addBtn.addEventListener('click', addTask);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') addTask();
      });

      render();
    </script>
  </body>
</html>
