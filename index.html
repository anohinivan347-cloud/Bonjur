<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechStar Portal</title>
  <style>
    :root {
      --bg: #0A0A0F;
      --panel: #121320;
      --panel-soft: #171A2A;
      --text: #E6ECFF;
      --muted: #8FA3C8;
      --neon: #00A3FF;
      --neon-soft: rgba(0, 163, 255, 0.2);
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --line: #23263D;
      --radius: 12px;
      --bg-grad-1: #132640;
      --bg-grad-2: #0A0A0F;
      --card-glow: rgba(0, 163, 255, 0.22);
      --card-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      --topbar-blur: rgba(18, 19, 32, 0.78);
      --avatar-ring: rgba(0, 163, 255, 0.3);
    }

    body[data-theme="light"] {
      --bg: #F4F8FF;
      --panel: #FFFFFF;
      --panel-soft: #EEF4FF;
      --text: #18253E;
      --muted: #50607C;
      --neon: #1B6BFF;
      --neon-soft: rgba(27, 107, 255, 0.18);
      --line: #D8E4FF;
      --bg-grad-1: #DCEBFF;
      --bg-grad-2: #F4F8FF;
      --card-glow: rgba(27, 107, 255, 0.14);
      --card-shadow: 0 12px 34px rgba(24, 37, 62, 0.1);
      --topbar-blur: rgba(255, 255, 255, 0.84);
      --avatar-ring: rgba(27, 107, 255, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: radial-gradient(circle at top right, var(--bg-grad-1) 0%, var(--bg-grad-2) 45%);
      color: var(--text);
      min-height: 100vh;
      transition: background .35s ease, color .25s ease;
      position: relative;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      pointer-events: none;
      z-index: -1;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(10px);
      animation: floatGlow 12s ease-in-out infinite;
    }
    body::before {
      top: -120px;
      right: -80px;
      background: radial-gradient(circle, rgba(0, 163, 255, .2) 0%, transparent 70%);
    }
    body::after {
      bottom: -140px;
      left: -90px;
      background: radial-gradient(circle, rgba(82, 76, 255, .2) 0%, transparent 70%);
      animation-delay: -5s;
    }

    @keyframes floatGlow {
      0%,100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-16px) scale(1.06); }
    }

    .hidden { display: none !important; }
    .container { width: min(1280px, 96%); margin: 0 auto; }

    /* Auth */
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      background: #0f1220;
      border: 1px solid var(--neon-soft);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 163, 255, 0.12);
      overflow: hidden;
    }
    .auth-left {
      background: linear-gradient(155deg, #0b1222, #122f4a 70%, #0f1630);
      padding: 26px;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .auth-right { padding: 26px; }

    h1, h2, h3, h4 { margin: 0 0 10px; }
    p { margin: 0 0 10px; color: var(--muted); line-height: 1.45; }
    hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

    label { display: block; margin-bottom: 6px; font-size: 14px; color: #BFD2FF; }
    input, textarea, select {
      width: 100%;
      border: 1px solid #2B3251;
      border-radius: 10px;
      background: #111522;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 3px var(--neon-soft);
    }
    textarea { resize: vertical; min-height: 84px; }

    button {
      border: 1px solid transparent;
      background: linear-gradient(90deg, #0A7ED1, #00A3FF);
      color: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-outline { background: transparent; border-color: var(--neon); color: #88D4FF; }
    .btn-danger { background: linear-gradient(90deg, #b91c1c, #ef4444); }
    .btn-success { background: linear-gradient(90deg, #15803d, #22c55e); }
    .btn-warning { background: linear-gradient(90deg, #b45309, #f59e0b); }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .form-group { margin-bottom: 12px; }

    /* Generic app shell */
    .topbar {
      margin: 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      position: sticky;
      top: 10px;
      z-index: 4;
      backdrop-filter: blur(12px);
      background: var(--topbar-blur);
      box-shadow: var(--card-shadow);
    }
    .topbar .badge {
      display: inline-block;
      border: 1px solid var(--neon-soft);
      color: #83CBFF;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    /* HR layout */
    .hr-layout {
      display: grid;
      grid-template-columns: 250px 1fr 360px;
      gap: 12px;
      min-height: calc(100vh - 120px);
      margin-bottom: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      overflow: auto;
      box-shadow: var(--card-shadow);
      transition: transform .2s ease, box-shadow .25s ease, border-color .2s ease;
    }
    .panel:hover {
      border-color: rgba(110, 157, 255, .4);
    }
    .menu-item {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      background: #111626;
      border: 1px solid #20284a;
      color: var(--text);
    }
    .menu-item.active {
      border-color: var(--neon);
      box-shadow: 0 0 12px var(--neon-soft);
      color: #BFE7FF;
    }
    .detail-card {
      border: 1px solid #293556;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: var(--panel-soft);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .25s ease, border-color .2s ease;
      position: relative;
      overflow: hidden;
    }
    .detail-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,.12) 48%, transparent 56%);
      transform: translateX(-115%);
      transition: transform .8s ease;
      pointer-events: none;
    }
    .detail-card:hover::after { transform: translateX(115%); }
    .detail-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px var(--card-glow), 0 12px 25px rgba(0, 0, 0, 0.22);
      border-color: color-mix(in srgb, var(--neon), #fff 20%);
    }
    .detail-card.active { border-color: var(--neon); }

    .theme-toggle {
      min-width: 170px;
      background: linear-gradient(90deg, #4b4ff9, var(--neon));
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--avatar-ring);
      box-shadow: 0 0 0 4px rgba(126, 188, 255, .08);
      background: #d9e7ff;
    }
    .profile-hero {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--panel-soft), #fff 10%), var(--panel));
      margin-bottom: 10px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .meta-item {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px; font-size: 14px; text-align: left; }
    th { color: #ADD5FF; font-size: 13px; }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #3A4F7A;
      background: #17213A;
      font-size: 12px;
      color: #96D5FF;
    }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
    .tab-btn { background: #13192D; border: 1px solid #2F3E63; }
    .tab-btn.active { border-color: var(--neon); color: #AEE2FF; box-shadow: 0 0 12px var(--neon-soft); }

    .grid { display: grid; gap: 10px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .chart-row {
      background: #121B31;
      border: 1px solid #2C3A5F;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0A7ED1, #00A3FF);
    }

    .modal {
      position: fixed; inset: 0; background: rgba(2,5,11,0.75);
      display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-box {
      width: min(900px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #0f1324;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }

    #hrDetailsToggle { display: none; margin-bottom: 8px; }

    @media (max-width: 1000px) {
      .hr-layout { grid-template-columns: 80px 1fr; }
      .menu-text, .logo-sub { display: none; }
      .menu-item { text-align: center; padding: 10px 0; }
      #hrDetails { display: none; }
      #hrDetailsToggle { display: inline-block; }
      #hrDetails.show-mobile {
        display: block;
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 780px) {
      .auth-card { grid-template-columns: 1fr; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .hr-layout { grid-template-columns: 1fr; }
      #hrMenu { display: flex; gap: 8px; overflow: auto; }
      #hrMenu .menu-item { min-width: 140px; }
      .mobile-tabs-select { display: block; margin-bottom: 8px; }
      .tabs.collapse-mobile { display: none; }
      .meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section id="authSection" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-left">
        <h2>TechStar Corporate Portal</h2>
        <p>Клиентское SPA на localStorage для управления наймом, обучением и кадровыми процессами.</p>
        <ul>
          <li>HR: 6 модулей + детали справа.</li>
          <li>Кандидат: 4 вкладки.</li>
          <li>Сотрудник: 3 вкладки.</li>
        </ul>
        <p><strong>HR:</strong> hr@techstar.com / 123</p>
      </div>
      <div class="auth-right">
        <h3>Вход</h3>
        <form id="loginForm">
          <div class="form-group"><label>Email</label><input id="loginEmail" type="email" required></div>
          <div class="form-group"><label>Пароль</label><input id="loginPassword" type="password" required></div>
          <button type="submit">Войти</button>
        </form>
        <hr>
        <h3>Регистрация</h3>
        <form id="registerForm">
          <div class="form-group"><label>Email</label><input id="regEmail" type="email" required></div>
          <div class="form-group"><label>Пароль</label><input id="regPassword" type="password" minlength="3" required></div>
          <div class="form-group">
            <label>Роль</label>
            <select id="regRole" required>
              <option value="candidate">candidate</option>
              <option value="employee">employee</option>
            </select>
          </div>
          <button type="submit">Зарегистрироваться</button>
        </form>
      </div>
    </div>
  </section>

  <section id="appSection" class="container hidden"></section>

  <div class="modal" id="mainModal">
    <div class="modal-box">
      <div class="actions" style="justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 id="modalTitle">Окно</h3>
        <button class="btn-outline" onclick="closeModal()">Закрыть</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const KEYS = {
      users: 'users', candidates: 'candidates', employees: 'employees', vacancies: 'vacancies', tests: 'tests', testResults: 'testResults', session: 'currentUser', theme: 'theme'
    };

    const CANDIDATE_STATUSES = ['Новый', 'В рассмотрении', 'Собеседование', 'Тест назначен', 'Оффер', 'Принят на работу', 'Отказ'];
    const HR_MENU = ['Вакансии', 'Кандидаты', 'Статистика', 'Тесты', 'Сотрудники', 'Настройки'];

    const ui = {
      hrModule: 0,
      hrSelected: null,
      candidateTab: 0,
      employeeTab: 0,
      detailsOpenMobile: false
    };

    const uid = () => Math.floor(Date.now() + Math.random() * 100000);
    const now = () => new Date().toISOString();
    const formatDate = (v) => new Date(v).toLocaleDateString('ru-RU');
    const esc = (v = '') => String(v).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const getData = key => JSON.parse(localStorage.getItem(key) || '[]');
    const setData = (k, v) => localStorage.setItem(k, JSON.stringify(v));
    const getSession = () => JSON.parse(localStorage.getItem(KEYS.session) || 'null');
    const setSession = v => localStorage.setItem(KEYS.session, JSON.stringify(v));
    const getTheme = () => localStorage.getItem(KEYS.theme) || 'dark';
    const setTheme = v => localStorage.setItem(KEYS.theme, v);

    function applyTheme(theme = getTheme()) {
      document.body.setAttribute('data-theme', theme);
    }

    function initDemoData() {
      if (localStorage.getItem(KEYS.users)) return;

      const hr = { id: uid(), email: 'hr@techstar.com', password: '123', role: 'hr' };
      const cUsers = [
        { id: uid(), email: 'alex.smirnov@demo.com', password: '123', role: 'candidate' },
        { id: uid(), email: 'anna.kuznetsova@demo.com', password: '123', role: 'candidate' },
        { id: uid(), email: 'dmitry.popov@demo.com', password: '123', role: 'candidate' }
      ];
      const eUsers = [
        { id: uid(), email: 'irina.sokolova@demo.com', password: '123', role: 'employee' },
        { id: uid(), email: 'nikita.fedorov@demo.com', password: '123', role: 'employee' }
      ];

      setData(KEYS.users, [hr, ...cUsers, ...eUsers]);

      const vacancies = [
        { id: uid(), title: 'Frontend Engineer', status: 'Открыта', description: 'Разработка UI в продуктовой команде', requirements: 'JS, CSS, SPA', salary: '220000', createdAt: now(), closedAt: null },
        { id: uid(), title: 'Backend Engineer', status: 'Открыта', description: 'API и интеграции', requirements: 'Node.js, PostgreSQL', salary: '250000', createdAt: now(), closedAt: null },
        { id: uid(), title: 'HR Generalist', status: 'Пауза', description: 'Массовый и точечный найм', requirements: 'Опыт 2+ года', salary: '170000', createdAt: now(), closedAt: null }
      ];
      setData(KEYS.vacancies, vacancies);

      setData(KEYS.candidates, [
        {
          id: uid(), userId: cUsers[0].id, fullName: 'Алексей Смирнов', contacts: 'alex.smirnov@demo.com', desiredPosition: 'Frontend Engineer', status: 'В рассмотрении',
          experience: '2 года', education: 'СПбПУ, информатика', sourcing: 'LinkedIn', specialty: 'Web', skills: ['JavaScript', 'React'], educations: ['СПбПУ 2018-2022'], workPlaces: ['SoftByte (Junior Frontend)'],
          city: 'Санкт-Петербург', portfolio: 'https://github.com/alex-smirnov-dev', about: 'Увлекаюсь интерактивными интерфейсами и web-анимациями.',
          photo: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80',
          vacancyId: vacancies[0].id, assignedTests: [], createdAt: now(), updatedAt: now(), lockResume: true
        },
        {
          id: uid(), userId: cUsers[1].id, fullName: 'Анна Кузнецова', contacts: 'anna.kuznetsova@demo.com', desiredPosition: 'Backend Engineer', status: 'Тест назначен',
          experience: '3 года', education: 'ИТМО', sourcing: 'hh.ru', specialty: 'Backend', skills: ['Node.js', 'SQL'], educations: ['ИТМО 2017-2021'], workPlaces: ['CodeRiver (Backend Dev)'],
          city: 'Казань', portfolio: 'https://github.com/anna-kuznetsova', about: 'Люблю проектировать API и оптимизировать запросы.',
          photo: 'https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=300&q=80',
          vacancyId: vacancies[1].id, assignedTests: [], createdAt: now(), updatedAt: now(), lockResume: true
        },
        {
          id: uid(), userId: cUsers[2].id, fullName: 'Дмитрий Попов', contacts: 'dmitry.popov@demo.com', desiredPosition: 'HR Generalist', status: 'Новый',
          experience: '1.5 года', education: 'РАНХиГС', sourcing: 'Referral', specialty: 'HR', skills: ['Рекрутинг', 'Оценка'], educations: ['РАНХиГС 2016-2020'], workPlaces: ['PeopleDrive (Recruiter)'],
          city: 'Москва', portfolio: 'https://linkedin.com/in/dmitry-popov-hr', about: 'Фокус на адаптации и оценке навыков.',
          photo: 'https://images.unsplash.com/photo-1544723795-3fb6469f5b39?auto=format&fit=crop&w=300&q=80',
          vacancyId: vacancies[2].id, assignedTests: [], createdAt: now(), updatedAt: now(), lockResume: false
        },
        {
          id: uid(), userId: null, fullName: 'Елена Морозова', contacts: 'elena.m@mail.com', desiredPosition: 'Frontend Engineer', status: 'Собеседование',
          experience: '4 года', education: 'МФТИ', sourcing: 'Telegram', specialty: 'Frontend', skills: ['Vue', 'TypeScript'], educations: ['МФТИ 2014-2018'], workPlaces: ['BrightApps'],
          city: 'Новосибирск', portfolio: 'https://dribbble.com/elenam', about: 'Делаю красивые и удобные UX-сценарии.',
          photo: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=300&q=80',
          vacancyId: vacancies[0].id, assignedTests: [], createdAt: now(), updatedAt: now(), lockResume: true
        }
      ]);

      const tests = [
        {
          id: uid(), title: 'Tech Screening: Candidate', description: 'Базовый тест для кандидатов', category: 'candidate',
          questions: [
            { text: 'Что такое замыкание?', type: 'text', keyword: 'функц' },
            { text: 'Выберите примитивы JS', type: 'multi', options: ['string', 'number', 'object'], correct: ['string', 'number'] },
            { text: 'Какой метод для массивов создаёт новый массив?', type: 'single', options: ['map', 'push', 'sort'], correct: 'map' }
          ]
        },
        {
          id: uid(), title: 'Team Communication', description: 'Тест для сотрудников', category: 'employee',
          questions: [
            { text: 'Что важно в обратной связи?', type: 'text', keyword: 'конкрет' },
            { text: 'Выберите инструменты командной синхронизации', type: 'multi', options: ['daily standup', 'silent mode', 'retrospective'], correct: ['daily standup', 'retrospective'] }
          ]
        }
      ];
      setData(KEYS.tests, tests);

      const candidates = getData(KEYS.candidates);
      candidates[1].assignedTests = [tests[0].id];
      setData(KEYS.candidates, candidates);

      setData(KEYS.employees, [
        { id: uid(), userId: eUsers[0].id, fullName: 'Ирина Соколова', position: 'Product Manager', hireDate: now(), assignedTests: [tests[1].id] },
        { id: uid(), userId: eUsers[1].id, fullName: 'Никита Фёдоров', position: 'QA Engineer', hireDate: now(), assignedTests: [] }
      ]);

      setData(KEYS.testResults, []);
    }

    function openModal(title, html) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('mainModal').classList.add('open');
    }
    function closeModal() { document.getElementById('mainModal').classList.remove('open'); }
    window.closeModal = closeModal;

    function login(email, password) {
      const user = getData(KEYS.users).find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
      if (!user) return alert('Неверный email или пароль');
      setSession(user);
      render();
    }

    function register(email, password, role) {
      const users = getData(KEYS.users);
      if (!email || !password) return alert('Заполните email и пароль');
      if (role === 'hr') return alert('Роль hr доступна только преднастроенному пользователю');
      if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) return alert('Пользователь уже существует');

      const user = { id: uid(), email, password, role };
      users.push(user);
      setData(KEYS.users, users);
      if (role === 'candidate') {
        const arr = getData(KEYS.candidates);
        arr.push({ id: uid(), userId: user.id, fullName: '', contacts: email, desiredPosition: '', status: 'Новый', experience: '', education: '', skills: [], educations: [], workPlaces: [], sourcing: '', specialty: '', city: '', portfolio: '', about: '', photo: '', vacancyId: null, assignedTests: [], createdAt: now(), updatedAt: now(), lockResume: false });
        setData(KEYS.candidates, arr);
      } else {
        const arr = getData(KEYS.employees);
        arr.push({ id: uid(), userId: user.id, fullName: '', position: 'Не назначена', hireDate: now(), assignedTests: [] });
        setData(KEYS.employees, arr);
      }
      alert('Регистрация успешна. Теперь выполните вход.');
    }

    function logout() {
      localStorage.removeItem(KEYS.session);
      render();
    }

    function render() {
      const auth = document.getElementById('authSection');
      const app = document.getElementById('appSection');
      const user = getSession();

      if (!user) {
        app.classList.add('hidden');
        auth.classList.remove('hidden');
        return;
      }

      auth.classList.add('hidden');
      app.classList.remove('hidden');

      if (user.role === 'hr') renderHr(user);
      if (user.role === 'candidate') renderCandidate(user);
      if (user.role === 'employee') renderEmployee(user);
    }

      return `

          <div>

            <button class="theme-toggle" onclick="toggleTheme()">${currentTheme === 'dark' ? '☀️ Светлая тема' : '🌙 Тёмная тема'}</button>
            <button class="btn-danger" onclick="logout()">Выход</button>
          </div>
        </div>
      `;

    function toggleTheme() {
      const next = getTheme() === 'dark' ? 'light' : 'dark';

      render();

      const f = e.target;

    function hireCandidate(candidateId) {
      const candidates = getData(KEYS.candidates);
      const users = getData(KEYS.users);
      const employees = getData(KEYS.employees);
      const idx = candidates.findIndex(c => c.id === candidateId);
      if (idx < 0) return;
      const c = candidates[idx];
      c.status = 'Принят на работу';
      c.updatedAt = now();

      if (c.userId) {
        const uIdx = users.findIndex(u => u.id === c.userId);
        if (uIdx >= 0) users[uIdx].role = 'employee';
      }

      employees.push({
        id: uid(),
        userId: c.userId || uid(),
        fullName: c.fullName,
        position: c.desiredPosition || 'Сотрудник',
        hireDate: now(),
        assignedTests: []
      });

      setData(KEYS.users, users);
      setData(KEYS.employees, employees);
      setData(KEYS.candidates, candidates.filter(x => x.id !== candidateId));
      ui.hrSelected = null;
      alert('Кандидат принят на работу. Роль пользователя обновлена (если была связка userId).');
      render();

    /* HR: stats */
    function hrStatsMain() {
      const candidates = getData(KEYS.candidates);
      const results = getData(KEYS.testResults);
      const tests = getData(KEYS.tests);
      const employees = getData(KEYS.employees);

      const maxCount = Math.max(1, ...CANDIDATE_STATUSES.map(s => candidates.filter(c => c.status===s).length));
      const candidateUserIds = candidates.map(c => c.userId).filter(Boolean);
      const candidateResults = results.filter(r => candidateUserIds.includes(r.userId));
      const avgCandidate = candidateResults.length ? (candidateResults.reduce((a,b)=>a+b.score,0)/candidateResults.length).toFixed(1) : '0';
      const employeeResults = results.filter(r => tests.some(t => t.id===r.testId && t.category==='employee'));
      const passed = employeeResults.filter(r => r.score >= 60).length;
      const failed = employeeResults.filter(r => r.score < 60).length;
      const closedVacancies = getData(KEYS.vacancies).filter(v => v.status === 'Закрыта' && v.closedAt);
      const avgCloseDays = closedVacancies.length ? (closedVacancies.reduce((acc, v) => acc + (new Date(v.closedAt) - new Date(v.createdAt))/(1000*3600*24), 0)/closedVacancies.length).toFixed(1) : '—';

      return `
        <h3>Статистика</h3>
        <div class="panel" style="margin-bottom:8px;">
          <h4>Количество кандидатов по статусам</h4>
          ${CANDIDATE_STATUSES.map(s => {
            const count = candidates.filter(c => c.status===s).length;
            const width = Math.round((count / maxCount) * 100);
            return `<div class="chart-row"><div style="display:flex;justify-content:space-between;"><span>${s}</span><strong>${count}</strong></div><div class="bar" style="width:${width}%;"></div></div>`;
          }).join('')}
        </div>
        <div class="grid grid-2">
          <div class="panel"><h4>Средний балл кандидатов</h4><p style="font-size:28px;color:#98D9FF;">${avgCandidate}%</p></div>
          <div class="panel"><h4>Сотрудники: прошли / не прошли</h4><p style="font-size:24px;">${passed} / ${failed}</p><p>Всего сотрудников: ${employees.length}</p></div>
        </div>
        <div class="panel" style="margin-top:8px;"><h4>Среднее время закрытия вакансии</h4><p>${avgCloseDays === '—' ? 'Заглушка: пока нет закрытых вакансий' : `${avgCloseDays} дн.`}</p></div>
      `;
    }

    /* HR: tests */
    function hrTestsMain() {

      return `
        <div class="actions" style="justify-content:space-between;align-items:center;"><h3>Тесты</h3><button onclick="openTestModal()">Создать тест</button></div>
        ${tests.map(t => `<div class="detail-card ${ui.hrSelected===t.id?'active':''}" onclick="selectHrItem(${t.id})"><strong>${esc(t.title)}</strong><p>${esc(t.description)}</p><p><span class="pill">${t.category==='candidate'?'для кандидатов':'для сотрудников'}</span> · ${t.questions.length} вопросов</p></div>`).join('') || '<p>Нет тестов.</p>'}
      `;
    }

      if (!t) return '<h4>Детали теста</h4><p>Выберите тест.</p>';
      return `
        <h4>Редактирование теста</h4>
        <form onsubmit="updateTest(event, ${t.id})">
          <div class="form-group"><label>Название</label><input name="title" value="${esc(t.title)}" required></div>
          <div class="form-group"><label>Описание</label><textarea name="description" required>${esc(t.description)}</textarea></div>
          <div class="form-group"><label>Категория</label><select name="category"><option value="candidate" ${t.category==='candidate'?'selected':''}>кандидаты</option><option value="employee" ${t.category==='employee'?'selected':''}>сотрудники</option></select></div>
          <p>Вопросы: ${t.questions.length}. Для полной переработки удалите и создайте заново.</p>
          <div class="actions"><button type="submit">Сохранить</button><button type="button" class="btn-danger" onclick="removeTest(${t.id})">Удалить</button></div>
        </form>
      `;
    }

    function openTestModal() {
      openModal('Создание теста', `
        <form onsubmit="createTest(event)">
          <div class="form-group"><label>Название</label><input name="title" required></div>
          <div class="form-group"><label>Описание</label><textarea name="description" required></textarea></div>
          <div class="form-group"><label>Категория</label><select name="category"><option value="candidate">кандидаты</option><option value="employee">сотрудники</option></select></div>
          <div id="questionBuilder"></div>
          <div class="actions"><button type="button" class="btn-outline" onclick="addQuestionRow()">+ Вопрос</button><button type="submit">Сохранить</button></div>
        </form>
      `);
      addQuestionRow();
    }

    function addQuestionRow(seed = null) {
      const root = document.getElementById('questionBuilder');
      if (!root) return;
      const row = document.createElement('div');
      row.className = 'detail-card';
      row.innerHTML = `
        <div class="form-group"><label>Текст вопроса</label><input name="q_text" value="${esc(seed?.text || '')}" required></div>
        <div class="form-group"><label>Тип</label><select name="q_type"><option value="single" ${seed?.type==='single'?'selected':''}>single</option><option value="multi" ${seed?.type==='multi'?'selected':''}>multi</option><option value="text" ${seed?.type==='text'?'selected':''}>text</option></select></div>
        <div class="form-group"><label>Варианты через ; (необязательно для text)</label><input name="q_options" value="${esc((seed?.options||[]).join('; '))}"></div>
        <div class="form-group"><label>Правильный ответ (для multi через ;, для text ключевое слово)</label><input name="q_correct" value="${esc(Array.isArray(seed?.correct)?seed.correct.join('; '):(seed?.correct || seed?.keyword || ''))}" required></div>
        <button type="button" class="btn-danger" onclick="this.parentElement.remove()">Удалить</button>
      `;
      root.appendChild(row);
    }

    function createTest(e) {
      e.preventDefault();
      const form = e.target;
      const title = form.title.value.trim();
      const description = form.description.value.trim();
      const category = form.category.value;
      const qRows = Array.from(form.querySelectorAll('#questionBuilder .detail-card'));
      if (!qRows.length) return alert('Добавьте вопросы');
      const questions = qRows.map(row => {
        const text = row.querySelector('[name="q_text"]').value.trim();
        const type = row.querySelector('[name="q_type"]').value;
        const options = row.querySelector('[name="q_options"]').value.split(';').map(v => v.trim()).filter(Boolean);
        const raw = row.querySelector('[name="q_correct"]').value.trim();
        if (type === 'text') return { text, type, keyword: raw.toLowerCase() };
        if (type === 'multi') return { text, type, options, correct: raw.split(';').map(v => v.trim()).filter(Boolean) };
        return { text, type, options, correct: raw };
      });

      const tests = getData(KEYS.tests);
      tests.push({ id: uid(), title, description, category, questions });
      setData(KEYS.tests, tests);
      closeModal();
      render();
    }

    function updateTest(e, id) {
      e.preventDefault();
      const arr = getData(KEYS.tests);
      const idx = arr.findIndex(t => t.id === id);
      if (idx < 0) return;
      arr[idx] = { ...arr[idx], ...Object.fromEntries(new FormData(e.target).entries()) };
      setData(KEYS.tests, arr);
      render();
    }

    function removeTest(id) {
      if (!confirm('Удалить тест?')) return;
      setData(KEYS.tests, getData(KEYS.tests).filter(t => t.id !== id));
      ui.hrSelected = null;
      render();
    }

    window.openTestModal = openTestModal;
    window.addQuestionRow = addQuestionRow;
    window.createTest = createTest;
    window.updateTest = updateTest;
    window.removeTest = removeTest;

    /* HR employees */
    function hrEmployeesMain() {
      const employees = getData(KEYS.employees);
      const posFilter = document.getElementById('empFilter')?.value || 'all';
      const unique = [...new Set(employees.map(e => e.position || 'Не назначена'))];
      const rows = employees.filter(e => posFilter === 'all' || e.position === posFilter);
      return `
        <h3>Сотрудники</h3>
        <div class="form-group"><label>Фильтр по должности</label><select id="empFilter" onchange="render()"><option value="all">Все</option>${unique.map(p => `<option ${p===posFilter?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
        ${rows.map(e => `<div class="detail-card ${ui.hrSelected===e.id?'active':''}" onclick="selectHrItem(${e.id})"><strong>${esc(e.fullName || 'Без имени')}</strong><p>${esc(e.position)} · ${formatDate(e.hireDate)}</p></div>`).join('') || '<p>Нет сотрудников</p>'}
      `;
    }

    function hrEmployeeDetails() {
      const e = getData(KEYS.employees).find(x => x.id === ui.hrSelected);
      if (!e) return '<h4>Профиль сотрудника</h4><p>Выберите сотрудника.</p>';
      const user = getData(KEYS.users).find(u => u.id === e.userId);
      const results = getData(KEYS.testResults).filter(r => r.userId === e.userId);
      return `
        <h4>${esc(e.fullName || 'Сотрудник')}</h4>
        <p>Email: ${esc(user?.email || 'n/a')}</p>
        <p>Должность: ${esc(e.position)}</p>
        <p>Дата приёма: ${formatDate(e.hireDate)}</p>
        <h4>История тестов</h4>
        <table><thead><tr><th>Тест</th><th>Баллы</th><th>Дата</th></tr></thead><tbody>
          ${results.map(r => `<tr><td>${esc((getData(KEYS.tests).find(t => t.id === r.testId)?.title) || '—')}</td><td>${r.score}%</td><td>${formatDate(r.date)}</td></tr>`).join('') || '<tr><td colspan="3">Нет результатов</td></tr>'}
        </tbody></table>
      `;
    }

    /* HR settings */
    function hrSettingsMain() {
      const user = getSession();
      return `
        <h3>Настройки</h3>
        <p>Email: <strong>${esc(user.email)}</strong></p>
        <p>Роль: <strong>${esc(user.role)}</strong></p>
        <button class="btn-danger" onclick="resetStorage()">Сбросить все данные</button>
      `;
    }

    function resetStorage() {
      if (!confirm('Очистить localStorage и пересоздать демо-данные?')) return;
      localStorage.clear();
      initDemoData();
      localStorage.removeItem(KEYS.session);
      render();
    }
    window.resetStorage = resetStorage;

    function selectHrItem(id) { ui.hrSelected = id; render(); }
    window.selectHrItem = selectHrItem;

    /* Candidate panel */
    function renderCandidate(user) {
      const app = document.getElementById('appSection');
      app.innerHTML = `
        ${renderTopbar(user, 'Панель кандидата')}
        ${renderTabs(['Моё резюме','Тестирование','О компании','Курсы'], ui.candidateTab, 'setCandidateTab')}
        <div class="panel">${candidateContent(user)}</div>
      `;
    }

    function setCandidateTab(i) { ui.candidateTab = i; render(); }
    window.setCandidateTab = setCandidateTab;

    function candidateContent(user) {
      if (ui.candidateTab === 0) return candidateResume(user);
      if (ui.candidateTab === 1) return candidateTests(user);
      if (ui.candidateTab === 2) return `<h3>О компании</h3><p>TechStar разрабатывает цифровые продукты для корпоративного сектора.</p><p>Миссия: раскрывать потенциал людей и технологий.</p><p>Контакты: hr@techstar.com · +7 (800) 700-77-77</p>`;
      return candidateCourses(user);
    }

    function candidateResume(user) {
      const arr = getData(KEYS.candidates);
      const idx = arr.findIndex(c => c.userId === user.id);
      if (idx < 0) return '<p>Профиль кандидата не найден.</p>';
      const c = arr[idx];
      const locked = !!c.lockResume || !['Новый', 'В рассмотрении'].includes(c.status);
      return `
        <h3>Моё резюме</h3>
        <p>Статус: <span class="pill">${esc(c.status)}</span></p>
        <div class="profile-hero">
          <img class="avatar" src="${esc(c.photo || 'https://via.placeholder.com/140x140?text=Photo')}" alt="Фото кандидата">
          <div>
            <h4>${esc(c.fullName || 'Ваше имя')}</h4>
            <p>${esc(c.desiredPosition || 'Желаемая должность')}</p>
          </div>
        </div>
        <form onsubmit="saveCandidateResume(event)" ${locked ? 'style="opacity:.75;"' : ''}>
          <div class="form-group"><label>Фото (URL)</label><input name="photo" value="${esc(c.photo || '')}" ${locked?'disabled':''}></div>
          <div class="grid grid-2">
            <div class="form-group"><label>ФИО</label><input name="fullName" value="${esc(c.fullName || '')}" ${locked?'disabled':''} required></div>
            <div class="form-group"><label>Контакты</label><input name="contacts" value="${esc(c.contacts || '')}" ${locked?'disabled':''} required></div>
          </div>
          <div class="form-group"><label>Желаемая должность</label><input name="desiredPosition" value="${esc(c.desiredPosition || '')}" ${locked?'disabled':''} required></div>
          <div class="grid grid-2">
            <div class="form-group"><label>Город</label><input name="city" value="${esc(c.city || '')}" ${locked?'disabled':''}></div>
            <div class="form-group"><label>Портфолио / LinkedIn</label><input name="portfolio" value="${esc(c.portfolio || '')}" ${locked?'disabled':''}></div>
          </div>
          <div class="form-group"><label>О себе</label><textarea name="about" ${locked?'disabled':''}>${esc(c.about || '')}</textarea></div>
          <div class="form-group"><label>Опыт</label><textarea name="experience" ${locked?'disabled':''}>${esc(c.experience || '')}</textarea></div>
          <div class="form-group"><label>Образование</label><textarea name="education" ${locked?'disabled':''}>${esc(c.education || '')}</textarea></div>
          <div class="form-group"><label>Навыки (через ;)</label><input name="skills" value="${esc((c.skills || []).join('; '))}" ${locked?'disabled':''}></div>
          <div class="actions">
            <button type="submit" ${locked?'disabled':''}>Отправить резюме</button>
            <button type="button" class="btn-outline" onclick="openCandidateProfileByUser(${user.id})">Открыть анкету</button>
          </div>
        </form>
        ${locked ? '<p>Редактирование заблокировано после отправки или смены статуса HR.</p>' : ''}
      `;
    }

    function saveCandidateResume(e) {
      e.preventDefault();
      const user = getSession();
      const arr = getData(KEYS.candidates);
      const idx = arr.findIndex(c => c.userId === user.id);
      if (idx < 0) return;
      const fd = Object.fromEntries(new FormData(e.target).entries());
      arr[idx] = {
        ...arr[idx],
        ...fd,
        photo: fd.photo,
        city: fd.city,
        portfolio: fd.portfolio,
        about: fd.about,
        skills: fd.skills.split(';').map(s => s.trim()).filter(Boolean),
        updatedAt: now(),
        status: ['Новый'].includes(arr[idx].status) ? 'В рассмотрении' : arr[idx].status,
        lockResume: true
      };
      setData(KEYS.candidates, arr);
      alert('Резюме отправлено');
      render();
    }
    window.saveCandidateResume = saveCandidateResume;

    function candidateTests(user) {
      const c = getData(KEYS.candidates).find(x => x.userId === user.id);
      if (!c) return '<p>Профиль не найден.</p>';
      const all = getData(KEYS.tests);
      const assigned = all.filter(t => (c.assignedTests || []).includes(t.id));
      const results = getData(KEYS.testResults).filter(r => r.userId === user.id);
      const access = ['Тест назначен', 'Собеседование', 'Оффер', 'В рассмотрении'].includes(c.status);
      return `
        <h3>Тестирование</h3>
        ${!access ? '<p>Доступ к тестированию ограничен текущим статусом.</p>' : ''}
        ${assigned.map(t => {
          const done = results.some(r => r.testId === t.id);
          return `<div class="detail-card"><strong>${esc(t.title)}</strong><p>${esc(t.description)}</p>${done ? '<p>Пройден</p>' : (access ? `<button onclick="startTest(${t.id})">Пройти</button>` : '')}</div>`;
        }).join('') || '<p>Тесты не назначены.</p>'}
        <h4>История</h4>
        <table><thead><tr><th>Тест</th><th>Балл</th><th>Дата</th></tr></thead><tbody>
          ${results.map(r => `<tr><td>${esc((all.find(t => t.id===r.testId)?.title)||'—')}</td><td>${r.score}%</td><td>${formatDate(r.date)}</td></tr>`).join('') || '<tr><td colspan="3">Нет результатов</td></tr>'}
        </tbody></table>
      `;
    }

    function candidateCourses(user) {
      const key = `readCourses_${user.id}`;
      const read = JSON.parse(localStorage.getItem(key) || '[]');
      const courses = [
        { id: 'c1', title: 'Онбординг в TechStar', text: 'Короткий курс о ценностях и процессах.' },
        { id: 'c2', title: 'Эффективная коммуникация', text: 'Практики общения в распределённых командах.' },
        { id: 'c3', title: 'Безопасность данных', text: 'Основы безопасной работы с корпоративными данными.' }
      ];
      return `
        <h3>Курсы</h3>
        ${courses.map(c => `<div class="detail-card"><strong>${c.title}</strong><p>${c.text}</p><button class="${read.includes(c.id)?'btn-success':'btn-outline'}" onclick="toggleCourseRead('${c.id}')">${read.includes(c.id)?'Прочитано':'Отметить прочитанным'}</button></div>`).join('')}
      `;
    }

    function toggleCourseRead(id) {
      const user = getSession();
      const key = `readCourses_${user.id}`;
      let read = JSON.parse(localStorage.getItem(key) || '[]');
      read = read.includes(id) ? read.filter(x => x !== id) : [...read, id];
      localStorage.setItem(key, JSON.stringify(read));
      render();
    }
    window.toggleCourseRead = toggleCourseRead;

    /* Employee panel */
    function renderEmployee(user) {
      const app = document.getElementById('appSection');
      app.innerHTML = `
        ${renderTopbar(user, 'Панель сотрудника')}
        ${renderTabs(['Личный кабинет','Тесты','Результаты'], ui.employeeTab, 'setEmployeeTab')}
        <div class="panel">${employeeContent(user)}</div>
      `;
    }

    function setEmployeeTab(i) { ui.employeeTab = i; render(); }
    window.setEmployeeTab = setEmployeeTab;

    function employeeContent(user) {
      if (ui.employeeTab === 0) return employeeCabinet(user);
      if (ui.employeeTab === 1) return employeeTests(user);
      return employeeResults(user);
    }

    function employeeCabinet(user) {
      const emp = getData(KEYS.employees).find(e => e.userId === user.id);
      const results = getData(KEYS.testResults).filter(r => r.userId === user.id);
      return `
        <h3>Личный кабинет</h3>
        <p><strong>ФИО:</strong> ${esc(emp?.fullName || 'Не заполнено')}</p>
        <p><strong>Должность:</strong> ${esc(emp?.position || 'Не назначена')}</p>
        <p><strong>Дата приёма:</strong> ${emp ? formatDate(emp.hireDate) : '—'}</p>
        <p><strong>Email:</strong> ${esc(user.email)}</p>
        <h4>История тестов</h4>
        <table><thead><tr><th>Тест</th><th>Баллы</th><th>Дата</th></tr></thead><tbody>
          ${results.map(r => `<tr><td>${esc((getData(KEYS.tests).find(t => t.id===r.testId)?.title)||'—')}</td><td>${r.score}%</td><td>${formatDate(r.date)}</td></tr>`).join('') || '<tr><td colspan="3">Нет результатов</td></tr>'}
        </tbody></table>
      `;
    }

    function employeeTests(user) {
      const tests = getData(KEYS.tests).filter(t => t.category === 'employee');
      const emp = getData(KEYS.employees).find(e => e.userId === user.id);
      const allowedIds = (emp?.assignedTests && emp.assignedTests.length) ? emp.assignedTests : tests.map(t => t.id);
      const available = tests.filter(t => allowedIds.includes(t.id));
      const results = getData(KEYS.testResults).filter(r => r.userId === user.id);
      return `
        <h3>Тесты повышения квалификации</h3>
        ${available.map(t => {
          const done = results.some(r => r.testId === t.id);
          return `<div class="detail-card"><strong>${esc(t.title)}</strong><p>${esc(t.description)}</p>${done ? '<p>Уже пройден</p>' : `<button onclick="startTest(${t.id})">Пройти</button>`}</div>`;
        }).join('') || '<p>Нет доступных тестов</p>'}
      `;
    }

    function employeeResults(user) {
      const rows = getData(KEYS.testResults).filter(r => r.userId === user.id);
      return `
        <div class="actions" style="justify-content:space-between;align-items:center;"><h3>Результаты</h3><button class="btn-outline" onclick="alert('Сертификат будет доступен в следующей версии')">Скачать сертификат</button></div>
        <table><thead><tr><th>Тест</th><th>Дата</th><th>Балл</th></tr></thead><tbody>
          ${rows.map(r => `<tr><td>${esc((getData(KEYS.tests).find(t => t.id===r.testId)?.title)||'—')}</td><td>${formatDate(r.date)}</td><td>${r.score}%</td></tr>`).join('') || '<tr><td colspan="3">Пока пусто</td></tr>'}
        </tbody></table>
      `;
    }

    /* Shared tests runner */
    function startTest(testId) {
      const test = getData(KEYS.tests).find(t => t.id === testId);
      if (!test) return;
      openModal(`Тест: ${test.title}`, `
        <form onsubmit="submitTest(event, ${test.id})">
          ${test.questions.map((q, i) => `
            <div class="detail-card">
              <strong>${i + 1}. ${esc(q.text)}</strong>
              <div style="margin-top:8px;">${questionInput(q, i)}</div>
            </div>
          `).join('')}
          <button type="submit">Завершить тест</button>
        </form>
      `);
    }

    function questionInput(q, i) {
      if (q.type === 'text') return `<input name="q_${i}" required placeholder="Ваш ответ">`;
      if (q.type === 'single') return q.options.map(o => `<label><input type="radio" name="q_${i}" value="${esc(o)}" required> ${esc(o)}</label><br>`).join('');
      return q.options.map(o => `<label><input type="checkbox" name="q_${i}" value="${esc(o)}"> ${esc(o)}</label><br>`).join('');
    }

    function submitTest(e, testId) {
      e.preventDefault();
      const user = getSession();
      const test = getData(KEYS.tests).find(t => t.id === testId);
      if (!test) return;
      let correct = 0;
      const answers = {};

      test.questions.forEach((q, i) => {
        if (q.type === 'text') {
          const val = (e.target[`q_${i}`]?.value || '').trim().toLowerCase();
          answers[`q_${i}`] = val;
          if (val.includes((q.keyword || '').toLowerCase())) correct += 1;
        } else if (q.type === 'single') {
          const val = e.target[`q_${i}`]?.value || '';
          answers[`q_${i}`] = val;
          if (val === q.correct) correct += 1;
        } else {
          const vals = Array.from(e.target.querySelectorAll(`input[name='q_${i}']:checked`)).map(x => x.value).sort();
          answers[`q_${i}`] = vals;
          if (JSON.stringify(vals) === JSON.stringify((q.correct || []).slice().sort())) correct += 1;
        }
      });

      const score = Math.round((correct / test.questions.length) * 100);
      const results = getData(KEYS.testResults).filter(r => !(r.userId === user.id && r.testId === testId));
      results.push({ id: uid(), userId: user.id, testId, score, answers, date: now() });
      setData(KEYS.testResults, results);
      alert(`Результат: ${score}%`);
      closeModal();
      render();
    }

    window.startTest = startTest;
    window.submitTest = submitTest;

    function renderTabs(items, active, fnName) {
      const opts = items.map((item, i) => `<option value="${i}" ${i===active?'selected':''}>${item}</option>`).join('');
      return `
        <select class="mobile-tabs-select" onchange="${fnName}(Number(this.value))">${opts}</select>
        <div class="tabs collapse-mobile">${items.map((item, i) => `<button class="tab-btn ${i===active?'active':''}" onclick="${fnName}(${i})">${item}</button>`).join('')}</div>
      `;
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      login(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value);
    });

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      register(document.getElementById('regEmail').value.trim(), document.getElementById('regPassword').value, document.getElementById('regRole').value);
    });

    if (!localStorage.getItem(KEYS.theme)) {
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      setTheme(prefersLight ? 'light' : 'dark');
    }
    applyTheme();
    initDemoData();
    render();
  </script>
</body>
</html>
